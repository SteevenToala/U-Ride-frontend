name: Deploy to Vercel

on:
  push:
    branches:
      - develop # Cambia a main o master si es tu rama principal

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v3

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.41.3'

      - name: Instalar dependencias y compilar
        run: |
          flutter pub get
          flutter build web --dart-define=API_URL=${{ secrets.API_URL }} --release

      - name: Instalar Vercel CLI
        run: npm install --global vercel

      - name: Desplegar a Vercel (Producción)
        run: vercel deploy ./build/web --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

